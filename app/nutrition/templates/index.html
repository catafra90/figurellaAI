{# app/nutrition/templates/index.html #}
{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-6">
  <div class="mt-6">
    <h1 class="text-2xl font-semibold text-gray-900">Nutrition</h1>
    <p class="text-sm text-gray-600 mt-1">Plans, logs, and insights for your clients.</p>
  </div>

  <!-- Nutrition sections -->
  <div class="mt-6 grid gap-6 [grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))]">

    <!-- Meal Plans -->
    <a href="#"
       class="group rounded-2xl bg-white/90 backdrop-blur border border-white/70 p-4 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-pink-600 text-white grid place-items-center shadow-[0_8px_16px_rgba(236,72,153,.35)]">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" aria-hidden="true">
            <path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z" stroke="white" stroke-width="1.8"/>
            <path d="M8 3.8v4M16 3.8v4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-gray-900">Meal Plans</div>
          <div class="text-xs text-gray-600">Templates &amp; assignments</div>
        </div>
      </div>
    </a>

    <!-- Food Log -->
    <a href="#"
       class="group rounded-2xl bg-white/90 backdrop-blur border border-white/70 p-4 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-teal-600 text-white grid place-items-center shadow-[0_8px_16px_rgba(13,148,136,.35)]">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2.2" stroke="white" stroke-width="1.8"/>
            <path d="M8 8h8M8 12h8M8 16h5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-gray-900">Food Log</div>
          <div class="text-xs text-gray-600">Track daily intake</div>
        </div>
      </div>
    </a>

    <!-- Supplements -->
    <a href="#"
       class="group rounded-2xl bg-white/90 backdrop-blur border border-white/70 p-4 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-amber-500 text-white grid place-items-center shadow-[0_8px_16px_rgba(245,158,11,.35)]">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" aria-hidden="true">
            <rect x="5" y="6" width="14" height="12" rx="2" stroke="white" stroke-width="1.8"/>
            <path d="M5 10h14" stroke="white" stroke-width="1.8"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-gray-900">Supplements</div>
          <div class="text-xs text-gray-600">Schedule &amp; tracking</div>
        </div>
      </div>
    </a>

    <!-- Insights -->
    <a href="#"
       class="group rounded-2xl bg-white/90 backdrop-blur border border-white/70 p-4 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-violet-600 text-white grid place-items-center shadow-[0_8px_16px_rgba(124,58,237,.35)]">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" aria-hidden="true">
            <path d="M6 18v-6l4 3 7-8 1 1v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-gray-900">Insights</div>
          <div class="text-xs text-gray-600">Progress &amp; recommendations</div>
        </div>
      </div>
    </a>

  </div>
</div>
{% endblock %}
