<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Figurella Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            background-color: #fff;
            border-right: 1px solid #dee2e6;
            padding-top: 60px;
        }
        .sidebar .nav-link {
            color: #333;
        }
        .sidebar .nav-link.active {
            background-color: #ff69b4;
            color: #fff;
        }
        .main {
            margin-left: 220px;
            padding: 30px;
        }
        .navbar-brand img {
            height: 40px;
            cursor: pointer;
        }
        textarea {
            resize: none;
        }
    </style>
</head>
<body>

<!-- Navbar with centered clickable Figurella logo -->
<nav class="navbar navbar-light bg-light fixed-top">
    <div class="container-fluid justify-content-center">
        <a class="navbar-brand" href="{{ url_for('home.index') }}">
            <img src="{{ url_for('static', filename='images/figurella-logo.png') }}" alt="Figurella Logo">
        </a>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column p-3">
    <ul class="nav nav-pills flex-column">
        <!-- Removed the Home nav-item -->
        <li class="nav-item">
            <a href="{{ url_for('daily_checkin.report_home') }}" class="nav-link {% if active_page == 'daily-checkin' %}active{% endif %}">
                <i class="bi bi-journal-check"></i> Daily Checks
            </a>
        </li>
        <li class="nav-item">
            <a href="{{ url_for('clients.clients') }}" class="nav-link {% if active_page == 'clients' %}active{% endif %}">
                <i class="bi bi-people"></i> Contacts
            </a>
        </li>
    </ul>
</div>

<!-- Main content -->
<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
