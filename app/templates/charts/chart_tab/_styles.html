<style>
  /* pager */
  .pg-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:.5rem;background:#f3f4f6;color:#111827;border:1px solid #e5e7eb;font-weight:600;line-height:1;cursor:pointer}
  .pg-btn:hover{background:#e5e7eb}
  .pg-chip{min-width:28px;height:28px;padding:0 .4rem;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;background:#fff;color:#111827;border-radius:.5rem;font-weight:600;cursor:pointer}
  .pg-chip.active{background:#111827;color:#fff;border-color:#111827}

  /* table styles */
  .zebra-pink tbody tr:nth-child(even){background-color:rgba(204,0,102,.08)}
  .sticky-header th{position:sticky;top:0;background:rgba(249,250,251,.90);z-index:10}
  .highlight-col{background-color:rgba(255,0,0,.08)!important}
  .meas-card{overflow:hidden}
  .meas-scroll{overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
  .meas-zoom{transform:none;transform-origin:top left;width:100%}
  .meas-grid{--label:160px;--num:calc((100% - var(--label))/10)}
  .meas-grid table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:100%}
  .meas-grid+.meas-grid{margin-top:1rem}
  .meas-grid th,.meas-grid td{padding:.35rem .4rem;box-sizing:border-box}
  td[contenteditable="true"]{min-height:26px;outline:none;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td[data-date-cell]{position:relative;padding:0}
  td[data-date-cell] .cell-date{width:100%;height:26px;padding:0 .3rem;border:0;background:transparent;font:inherit;box-sizing:border-box;appearance:none;-webkit-appearance:none;cursor:pointer}
  td[data-date-cell] .cell-date:focus{outline:none;box-shadow:inset 0 0 0 2px rgba(204,0,102,.25);background:#fff}
  .cell-date:not(:focus):not(:valid)::-webkit-datetime-edit{color:transparent}
  .cell-date:not(:focus):not(:valid){color:transparent;caret-color:transparent}
  @-moz-document url-prefix(){.cell-date:not(:focus):not(:valid){color:transparent}}
  .cell-date::-webkit-calendar-picker-indicator{opacity:1}
  .cell-date::-webkit-clear-button,.cell-date::-webkit-inner-spin-button{display:none}
  .meas-select{width:100%;height:26px;border:0;background:transparent;font:inherit;padding:0 .25rem;outline:none}
  .meas-select:focus{box-shadow:inset 0 0 0 2px rgba(204,0,102,.25);background:#fff}
  .meas-flag{width:18px;height:18px;cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:.5rem;padding:.4rem .7rem;font-size:.875rem;line-height:1;border:1px solid transparent;cursor:pointer}
  .btn-add{background:#cc0066;color:#fff}.btn-add:hover{filter:brightness(.95)}
  .btn-remove{background:#f3f4f6;color:#111827;border:1px solid #e5e7eb}.btn-remove:hover{background:#e5e7eb}
  @media (max-width:1200px){.meas-grid{--label:140px}.meas-grid th,.meas-grid td{padding:.3rem .35rem}.meas-select,.cell-date{height:24px;font-size:.9em}}
  @media (max-width:980px){.meas-grid{--label:120px}.meas-grid th,.meas-grid td{padding:.25rem .3rem}.meas-select,.cell-date{height:22px;font-size:.85em}}
</style>
