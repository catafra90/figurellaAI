<div class="flex items-center justify-between">
  <h2 class="text-xl font-bold">Chart</h2>

  <div class="flex items-center gap-2">
    <nav id="chart-pager" class="flex items-center gap-1" aria-label="Charts pagination">
      <button type="button" class="pg-btn" data-act="prev" title="Previous chart">‹</button>
      <span id="pg-pages" class="inline-flex items-center gap-1"></span>
      <button type="button" class="pg-btn" data-act="next" title="Next chart">›</button>
    </nav>

    <button type="button" id="btn-new-chart" class="btn btn-add" title="Create a new chart page">
      <span aria-hidden="true">＋</span> New Chart
    </button>

    <button type="button" id="btn-del-chart" class="btn btn-remove" title="Delete current chart">
      <span aria-hidden="true">🗑</span> Delete
    </button>
  </div>
</div>
