<!-- Location Performance (with Current Week Attendance card) -->
<div class="mt-6">
  <div class="rounded-2xl bg-white/90 backdrop-blur border border-white/70 p-6 shadow-sm">
    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
      <!-- Bar Chart Icon -->
      <svg class="h-5 w-5 text-violet-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="10" width="3" height="9" rx="1" fill="currentColor"></rect>
        <rect x="10" y="6" width="3" height="13" rx="1" fill="currentColor" opacity=".85"></rect>
        <rect x="16" y="3" width="3" height="16" rx="1" fill="currentColor" opacity=".7"></rect>
      </svg>
      Location Performance
    </h2>

    <!-- Top metrics -->
    <div class="grid gap-4 sm:grid-cols-3">
      <!-- Active Clients -->
      <div class="p-4 rounded-xl bg-gray-50 border border-gray-200">
        <div class="text-sm text-gray-500">Active Clients</div>
        <div id="perf-active-clients" class="text-2xl font-bold text-gray-900">—</div>
      </div>

      <!-- New Clients (This Month) with Try / OK -->
      <div class="p-4 rounded-xl bg-gray-50 border border-gray-200">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-sm text-gray-500">New Clients (This Month)</div>
            <div id="perf-new-clients-total" class="text-2xl font-bold text-gray-900">—</div>
          </div>
          <div class="flex gap-2">
            <div class="px-3 py-1 rounded-lg bg-amber-100 text-amber-800 text-sm font-semibold">
              Try: <span id="perf-new-try">—</span>
            </div>
            <div class="px-3 py-1 rounded-lg bg-emerald-100 text-emerald-800 text-sm font-semibold">
              OK: <span id="perf-new-ok">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Current Week Attendance (new) -->
      <div class="p-4 rounded-xl bg-gray-50 border border-gray-200">
        <div class="text-sm text-gray-500">Current Week Attendance</div>
        <div id="perf-current-week-att" class="text-2xl font-bold text-gray-900">—</div>
      </div>
    </div>

    <!-- Attendance goal + comparisons -->
    <div class="mt-6 grid gap-4 lg:grid-cols-[290px,1fr]">
      <!-- Goal box -->
      <div class="p-4 rounded-xl bg-gray-50 border border-gray-200">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-medium text-gray-800">Weekly Attendance Goal</div>
          <button id="goal-reset" class="text-xs text-gray-500 hover:text-gray-700 underline">Reset</button>
        </div>
        <div class="flex items-center gap-3">
          <input
            id="attendance-goal"
            type="number"
            min="0"
            step="1"
            class="w-28 rounded-lg border-gray-300 focus:ring-figurella/40 focus:border-figurella text-gray-900"
            placeholder="e.g., 120">
          <button
            id="goal-save"
            class="px-3 py-2 text-sm rounded-lg bg-pink-600 text-white font-medium hover:bg-pink-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-pink-400">
            Save
          </button>
        </div>
        <div class="mt-3 text-sm text-gray-600">
          Current week: <span id="att-current" class="font-semibold text-gray-900">—</span><br>
          Goal gap: <span id="att-goal-gap" class="font-semibold">—</span>
        </div>
      </div>

      <!-- Dynamic attendance table -->
      <div class="rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
          <div class="text-sm font-medium text-gray-800">Attendance — Current vs Previous Weeks</div>
          <div class="text-xs text-gray-500">Current week compares against each prior week</div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 text-gray-600">
              <tr>
                <th class="text-left px-4 py-2 border-b">Week</th>
                <th class="text-right px-4 py-2 border-b">Previous</th>
                <th class="text-right px-4 py-2 border-b">Current</th>
                <th class="text-right px-4 py-2 border-b">Δ</th>
                <th class="text-right px-4 py-2 border-b">% Change</th>
              </tr>
            </thead>
            <tbody id="attendance-rows" class="divide-y divide-gray-200">
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Trend blurb (optional) -->
    <div class="mt-4 text-sm text-gray-600" id="trend-highlights" hidden>
      <span class="font-medium">Trend Highlights:</span>
      <span id="trend-text">—</span>
    </div>
  </div>
</div>

<!-- PERF_DATA seed (remove if you inject from Flask earlier on the page) -->
<script>
window.PERF_DATA = window.PERF_DATA || {
  active_clients: "—",
  new_clients: { "try": 0, "ok": 0 },
  attendance: {
    weeks: [
      { label: "This Week", count: 0, current: true },
      { label: "Last Week", count: 0 },
      { label: "2 Weeks Ago", count: 0 }
    ]
  }
};
</script>

<script>
(function () {
  const el = (id) => document.getElementById(id);
  const fmt = (n) => (Number.isFinite(n) ? n.toLocaleString() : "—");
  const fmtPct = (v) => (Number.isFinite(v) ? `${(v * 100).toFixed(1)}%` : "—");

  // ---- Load data ----
  const data = window.PERF_DATA || {};
  const active = Number(data.active_clients) || 0;

  // bracket-notation for reserved keys
  const tries = Number(data?.new_clients?.['try']) || 0;
  const oks   = Number(data?.new_clients?.['ok'])  || 0;
  const totalNew = tries + oks;

  const weeks = Array.isArray(data?.attendance?.weeks) ? data.attendance.weeks.slice() : [];
  if (!weeks.length) return;

  // Ensure first item is current week
  weeks.sort((a, b) => (b.current === true) - (a.current === true));
  const current = weeks[0] || { label: "Current", count: 0 };
  const previous = weeks.slice(1);

  // ---- Render top metrics ----
  el("perf-active-clients").textContent = fmt(active);
  el("perf-new-try").textContent = fmt(tries);
  el("perf-new-ok").textContent = fmt(oks);
  el("perf-new-clients-total").textContent = fmt(totalNew);

  // NEW: visible big number for current week
  el("perf-current-week-att").textContent = fmt(Number(current.count) || 0);

  // ---- Goal handling (localStorage) ----
  const GOAL_KEY = "figurella.attendance.goal";
  const goalInput = el("attendance-goal");
  const goalSave  = el("goal-save");
  const goalReset = el("goal-reset");
  const attCurrentEl = el("att-current");
  const goalGapEl    = el("att-goal-gap");

  const loadGoal = () => {
    const v = localStorage.getItem(GOAL_KEY);
    return v ? parseInt(v, 10) : NaN;
  };
  const setGoalUI = (g) => {
    if (Number.isFinite(g)) {
      goalInput.value = g;
      const gap = g - (Number(current.count) || 0);
      attCurrentEl.textContent = fmt(current.count);
      goalGapEl.textContent = (gap === 0 ? "On goal" : (gap > 0 ? `${fmt(gap)} to goal` : `${fmt(-gap)} over goal`));
      goalGapEl.className = "font-semibold " + (gap > 0 ? "text-amber-600" : (gap < 0 ? "text-emerald-600" : "text-gray-800"));
    } else {
      attCurrentEl.textContent = fmt(current.count);
      goalGapEl.textContent = "—";
      goalGapEl.className = "font-semibold text-gray-500";
    }
  };

  setGoalUI(loadGoal());

  goalSave.addEventListener("click", () => {
    const val = parseInt(goalInput.value, 10);
    if (Number.isFinite(val) && val >= 0) {
      localStorage.setItem(GOAL_KEY, String(val));
      setGoalUI(val);
    }
  });
  goalReset.addEventListener("click", () => {
    localStorage.removeItem(GOAL_KEY);
    goalInput.value = "";
    setGoalUI(NaN);
  });

  // ---- Attendance comparison table ----
  const tbody = el("attendance-rows");
  tbody.innerHTML = "";

  const cur = Number(current.count) || 0;

  const makeDeltaCell = (delta) => {
    const up = delta > 0, down = delta < 0;
    const cls = up ? "text-emerald-700" : (down ? "text-rose-700" : "text-gray-700");
    const badge = up ? "▲" : (down ? "▼" : "•");
    return `<span class="${cls} font-semibold">${badge} ${fmt(delta)}</span>`;
  };

  const makePctCell = (pct) => {
    const up = pct > 0, down = pct < 0;
    const cls = up ? "text-emerald-700" : (down ? "text-rose-700" : "text-gray-700");
    return `<span class="${cls} font-semibold">${fmtPct(pct)}</span>`;
  };

  previous.forEach((w) => {
    const prev = Number(w.count) || 0;
    const delta = cur - prev;
    const pct = prev === 0 ? (cur === 0 ? 0 : 1) : (delta / prev);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="px-4 py-2 text-gray-800">${w.label || "Previous"}</td>
      <td class="px-4 py-2 text-right tabular-nums text-gray-800">${fmt(prev)}</td>
      <td class="px-4 py-2 text-right tabular-nums text-gray-900 font-semibold">${fmt(cur)}</td>
      <td class="px-4 py-2 text-right tabular-nums">${makeDeltaCell(delta)}</td>
      <td class="px-4 py-2 text-right tabular-nums">${makePctCell(pct)}</td>
    `;
    tbody.appendChild(tr);
  });

  // ---- Optional trend sentence (current vs avg of previous) ----
  if (previous.length) {
    const avgPrev = previous.reduce((s, w) => s + (Number(w.count) || 0), 0) / previous.length;
    const deltaAvg = cur - avgPrev;
    const pctAvg = avgPrev === 0 ? (cur === 0 ? 0 : 1) : (deltaAvg / avgPrev);
    const trend = deltaAvg === 0
      ? "Attendance is flat vs recent average."
      : (deltaAvg > 0
          ? `Attendance is up ${fmt(deltaAvg)} (${fmtPct(pctAvg)}) vs recent average.`
          : `Attendance is down ${fmt(-deltaAvg)} (${fmtPct(pctAvg)}) vs recent average.`);
    const tBox = document.getElementById("trend-highlights");
    const tText = document.getElementById("trend-text");
    tText.textContent = trend;
    tBox.hidden = false;
  }
})();
</script>
