{# app/templates/figurella_reports/_workspace_sales_chart.html #}
<section id="workspace" class="panel-wrap" style="padding:0;">
  <style>
    #sales-chart-wrap { padding:1rem; }
    #sales-chart-title { color:#0f172a; margin:0 0 .5rem 0; font-weight:600; font-size:1.125rem; }
    #sales-chart-empty { color:#6b7280; font-size:.9rem; }
  </style>

  <div id="sales-chart-wrap">
    <h3 id="sales-chart-title">Monthly Sales (Contracts)</h3>
    <canvas id="sales-chart" height="110"></canvas>
    <div id="sales-chart-empty" class="hidden">No data available.</div>
  </div>

  {# Chart.js (isolated to this partial) #}
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
  (async function(){
    const endpoint = '/figurella-reports/contracts/sales-timeseries.json?months=18';

    function monthLabel(ym){
      const [Y,M] = ym.split('-').map(Number);
      const d = new Date(Y, (M||1)-1, 1);
      return d.toLocaleDateString(undefined, {year:'numeric', month:'short'});
    }

    try{
      const res = await fetch(endpoint, {credentials:'same-origin'});
      const data = await res.json();
      const pts  = Array.isArray(data?.points) ? data.points : [];

      if(!pts.length){
        document.getElementById('sales-chart-empty')?.classList.remove('hidden');
        return;
      }

      const labels = pts.map(p => monthLabel(p.month));
      const values = pts.map(p => Number(p.total || 0));

      const ctx = document.getElementById('sales-chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Sales',
            data: values,
            fill: true,
            tension: 0.25,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(ctx.parsed.y||0)
              }
            }
          },
          scales: {
            y: {
              ticks: {
                callback: (v)=> new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v)
              },
              grid: { color: 'rgba(0,0,0,0.06)' }
            },
            x: { grid: { display:false } }
          }
        }
      });
    }catch(e){
      console.warn('[Workspace Sales Chart] failed:', e);
      document.getElementById('sales-chart-empty')?.classList.remove('hidden');
    }
  })();
  </script>
</section>
