<!-- Metrics table (kept), without the white card wrapper -->
<div class="mt-6">
  <div class="overflow-x-auto">
    <table class="min-w-full max-w-xl border border-gray-200 text-sm">
      <thead>
        <tr>
          <th class="border border-gray-300 bg-gray-100 px-4 py-2 text-left font-semibold">Metric</th>
          <th class="border border-gray-300 bg-gray-100 px-4 py-2 text-left font-semibold">Value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="border px-4 py-2">GOAL</td>
          <td class="border px-4 py-2">
            <input id="metric-goal" class="w-full border rounded px-2 py-1">
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">PAYMENTS DUE</td>
          <td class="border px-4 py-2">
            <input id="metric-payments-due" class="w-full border rounded px-2 py-1">
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">PAYMENTS DONE</td>
          <td class="border px-4 py-2">
            <input id="metric-payments-done" class="w-full border rounded px-2 py-1">
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">SALES</td>
          <td class="border px-4 py-2">
            <input id="metric-sales" class="w-full border rounded px-2 py-1">
          </td>
        </tr>
        <tr>
          <td class="border px-4 py-2">MISSING</td>
          <td class="border px-4 py-2">
            <input id="metric-missing" class="w-full border rounded px-2 py-1" readonly>
          </td>
        </tr>
        <tr><td class="border px-4 py-2">MISSING - AVERAGE</td><td class="border px-4 py-2"><input class="w-full border rounded px-2 py-1"></td></tr>
        <tr><td class="border px-4 py-2">OK NEEDED</td><td class="border px-4 py-2"><input class="w-full border rounded px-2 py-1"></td></tr>
        <tr><td class="border px-4 py-2">CONSU TO DO</td><td class="border px-4 py-2"><input class="w-full border rounded px-2 py-1"></td></tr>
        <tr><td class="border px-4 py-2">LEADS TO ACTIVATE</td><td class="border px-4 py-2"><input class="w-full border rounded px-2 py-1"></td></tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  .contract-details-row .details-wrap { border-top: 1px solid #e5e7eb; }
  .contract-details-row table th,
  .contract-details-row table td { font-size: 0.9rem; }
</style>

<script>
(function () {
  // ===== Helpers =====
  const BODY_ID = 'mp-body';
  const TPL_ID  = 'mp-row-template';

  const log  = (...a)=>console.log('[MonthlyPlanning]', ...a);

  function getBody(){ return document.getElementById(BODY_ID); }
  function getTpl(){  return document.getElementById(TPL_ID); }

  function fmtCurrency(n){
    try { return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0)); }
    catch(e){ return `$${Number(n||0).toFixed(2)}`; }
  }
  function setCurrency(el, n){
    if (!el) return;
    try { el.value = new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0)); }
    catch { el.value = `$${Number(n||0).toFixed(2)}`; }
  }

  // ===== Pack → Price auto-fill =====
  function handlePackChange(e){
    const sel = e.target.closest('select.pack');
    if (!sel) return;
    const td  = sel.closest('td');
    const input = td?.nextElementSibling?.querySelector('input.price');
    if (!input) return;
    const opt = sel.selectedOptions && sel.selectedOptions[0];
    const raw = opt ? Number(opt.getAttribute('data-price') || 0) : 0;
    setCurrency(input, raw);
    if (typeof window.recalc === 'function') window.recalc(sel.closest('tr'));
  }
  function wirePackAuto(scope){
    const root = scope || document;
    root.querySelectorAll('select.pack').forEach(sel=>{
      sel.removeEventListener('change', handlePackChange);
      sel.addEventListener('change', handlePackChange);
      sel.dispatchEvent(new Event('change', {bubbles:false}));
    });
  }
  window.wirePackAuto = wirePackAuto;

  // ===== Row creation =====
  function setByKey(tr, key, val){
    const el = tr.querySelector(`[data-key="${key}"]`);
    if (!el) return;
    if (el.tagName === 'SELECT') { el.value = val ?? ''; }
    else { el.value = val ?? ''; }
  }

  function createRowFromTemplate(){
    const body = getBody(), tpl = getTpl();
    if (!body || !tpl) return null;
    const tr = tpl.content.firstElementChild.cloneNode(true);
    body.appendChild(tr);
    wirePackAuto(tr);
    if (typeof window.recalc === 'function') window.recalc(tr);
    return tr;
  }

  function createRowWithData(rowData){
    const tr = createRowFromTemplate();
    if (!tr) return null;
    setByKey(tr, 'internal_planning', rowData.internal_planning);
    setByKey(tr, 'current_contract',  rowData.current_contract);
    setByKey(tr, 'closing_date',      rowData.closing_date);
    setByKey(tr, 'status',    rowData.status);
    setByKey(tr, 'p1_pack',   rowData.p1_pack);
    setByKey(tr, 'p1_price',  rowData.p1_price);
    setByKey(tr, 'p2_pack',   rowData.p2_pack);
    setByKey(tr, 'p2_price',  rowData.p2_price);
    setByKey(tr, 'p3_pack',   rowData.p3_pack);
    setByKey(tr, 'p3_price',  rowData.p3_price);
    return tr;
  }

  // ===== Metrics / Missing =====
  function parseMoney(str){
    if (str == null) return 0;
    const s = String(str).trim();
    if (!s) return 0;
    const m = s.match(/[-+]?\d+(?:[.,]\d{3})*(?:[.,]\d{2})?/g);
    if (!m) return 0;
    let token = m[m.length-1];
    if (token.includes(',') && !token.includes('.')) token = token.replace(/\./g,'').replace(',', '.');
    else token = token.replace(/,/g,'');
    const n = Number(token);
    return isFinite(n) ? n : 0;
  }
  function updateMissing(){
  const goal  = parseMoney(document.getElementById('metric-goal')?.value);
  const due   = parseMoney(document.getElementById('metric-payments-due')?.value);
  const done  = parseMoney(document.getElementById('metric-payments-done')?.value);
  const sales = parseMoney(document.getElementById('metric-sales')?.value);
  const missing = goal - (due + done + sales);
  setCurrency(document.getElementById('metric-missing'), missing);
}


  // ===== Import from backend =====
  async function importExpiringContracts(){
    try{
      const base = window.MP_EXP_URL || '/daily-check-in/monthly-planning/expiring-contracts';
      const monthVal = document.getElementById('mp-month')?.value; // yyyy-mm
      const url = monthVal ? `${base}?month=${encodeURIComponent(monthVal)}` : base;

      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      const rows = Array.isArray(data.rows) ? data.rows : [];
      if (!rows.length){
        log('No expiring contracts for this month.');
        return;
      }
      rows.forEach(r => createRowWithData(r));
    } catch (err){
      console.error('[MonthlyPlanning] import failed:', err);
    }
  }

  // ===== Wire once =====
  function wire(){
    document.getElementById('mp-add-row')?.addEventListener('click', (e)=>{
      e.preventDefault(); createRowFromTemplate();
    });
    document.getElementById('mp-import-expiring')?.addEventListener('click', (e)=>{
      e.preventDefault(); importExpiringContracts();
    });
    document.getElementById('mp-body')?.addEventListener('click', (e)=>{
      const btn = e.target.closest('.row-del');
      if (!btn) return;
      e.preventDefault();
      const tr = btn.closest('tr');
      tr?.remove();
      if (typeof window.recalc === 'function') window.recalc();
      const body = document.getElementById('mp-body');
      if (body && body.rows.length === 0) createRowFromTemplate();
    });
    wirePackAuto(document);
    ['metric-goal','metric-payments-due','metric-payments-done','metric-sales']
      .forEach(id => document.getElementById(id)?.addEventListener('input', updateMissing));
    setTimeout(updateMissing, 0);
    importExpiringContracts();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', wire, { once:true });
  } else {
    wire();
  }
})();
</script>
