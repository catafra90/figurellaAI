<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Figurella Platform</title>

  <!-- Mobile-safe viewport + iOS safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA >>> Core installability + fullscreen on install -->
  <meta name="theme-color" content="#cc0066">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Figurella">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { figurella: '#CC0066' },
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            playfair: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- Optional: UI flag -->
  <script> window.SAVES_ENABLED = false; </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Component styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequency.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/move_preview.css') }}">

  <!-- Global responsive layout + modal + flags -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css', v=6) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/client_modal.css', v=11) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/flags.css', v=7) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile_ipad.css') }}?v=1">

  {% block extra_head %}{% endblock %}

  <!-- iPad Safari viewport reliability -->
  <style>
    html { height: -webkit-fill-available; -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; min-height: -webkit-fill-available; }
  </style>

  <style>
    html, body { height: 100%; }
    body { font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }

    .glass {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(120%) blur(10px);
      -webkit-backdrop-filter: saturate(120%) blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 10px 30px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.6);
      border-radius: 16px;
    }
    .glass-soft {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: saturate(120%) blur(8px);
      -webkit-backdrop-filter: saturate(120%) blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 24px rgba(0,0,0,.10);
      border-radius: 16px;
    }
    .hairline { border-color: rgba(0,0,0,.06); }

    :focus-visible { outline: 3px solid rgba(204, 0, 102, .35); outline-offset: 2px; border-radius: 10px; }

    .wallpaper{
      background:
        radial-gradient(70% 55% at 80% 40%, rgba(255,255,255,.85) 0%, rgba(255,255,255,.60) 25%, rgba(255,255,255,.15) 50%, transparent 70%),
        radial-gradient(60% 55% at 55% 105%, rgba(255,200,150,.75) 0%, rgba(255,200,150,.35) 35%, rgba(255,200,150,.10) 60%, transparent 70%),
        radial-gradient(75% 65% at 102% 0%, rgba(186,85,211,.85) 0%, rgba(186,85,211,.45) 40%, rgba(186,85,211,.10) 70%, transparent 80%),
        radial-gradient(80% 70% at -5% -15%, rgba(32,45,140,.95) 0%, rgba(32,45,140,.65) 45%, rgba(32,45,140,.25) 70%, transparent 80%),
        linear-gradient(180deg, #1f1b4a 0%, #2a275f 30%, #3a2e71 55%, #4c2f74 70%, #5b2d75 85%);
      filter: saturate(1.05);
    }
    .wallpaper-glow{
      background:
        radial-gradient(40% 35% at 30% 85%, rgba(255,180,60,.35), transparent 60%),
        radial-gradient(35% 30% at 80% 75%, rgba(255,140,220,.25), transparent 60%),
        radial-gradient(45% 40% at 20% 20%, rgba(120,170,255,.18), transparent 60%);
      filter: blur(28px);
      opacity:.85;
    }

    table tbody td, table tbody th { color: #000 !important; }
    table thead th { color: #111827; font-weight: 600; }
    input, select, textarea { color: #000 !important; }
    ::placeholder { color: #6b7280; }

    .client-modal { will-change: transform; contain: layout paint; }
    .client-modal .card, .client-modal .card-pad { contain: content; }
    .client-modal + .client-modal { box-shadow: 0 8px 24px rgba(0,0,0,.18); }

    #floating-modals { pointer-events: none; z-index: 4000 !important; }
    #floating-modals .client-modal { pointer-events: auto; }
  </style>

  <!-- iOS/iPad-specific tweaks -->
  <style>
    .ios :root { --vh: 1vh; }
    .ios body{ min-height: calc(var(--vh, 1vh) * 100); }
    .ios .tab-scroll, .ios .chart-table-scroll, .ios .measuresA-scroll{
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }
    .ios .sticky-header thead th{ background:#fff; }
    @media (max-width:1024px){
      .ios input[type="date"].field{ max-width: 10rem; }
      .ios .btn{ min-height: 40px; }
    }
  </style>

  <!-- Load tablet overrides last -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tablet.css') }}?v=t2">

  <!-- iPad modal hotfix -->
  <style id="ipad-modal-hotfix">
    @media (max-width:1024px){
      .client-modal .flag-group > input[type="checkbox"]{
        position:absolute !important; opacity:0 !important;
        width:1px !important; height:1px !important;
        margin:-1px !important; padding:0 !important;
        overflow:hidden !important; clip:rect(0,0,0,0) !important;
        white-space:nowrap !important; border:0 !important;
        pointer-events:none !important;
      }
      .client-modal .quick-flags, .client-modal .goals-pills{
        display:flex; flex-wrap:wrap; gap:.5rem .5rem;
      }
      .client-modal .flag-btn{ display:inline-flex; align-items:center; min-height:40px; }
      .client-modal .flex{ flex-wrap:wrap; gap:.5rem .75rem; }
      .client-modal .flex .label{ width:100% !important; }
      .client-modal .field{
        width:100% !important; max-width:100% !important;
        min-height:44px; font-size:16px; line-height:1.3;
      }
      .client-modal input[type="date"].field{ width:100% !important; }
      .client-modal table{ table-layout:fixed; width:100%; }
      .client-modal table th, .client-modal table td{
        min-width:0; white-space:normal; word-break:break-word; vertical-align:top;
      }
      .client-modal .sticky-header thead th{ background:#fff; }
    }
  </style>
</head>

<body class="font-sans text-gray-100 h-full flex flex-col overflow-hidden">

  <!-- Global wallpaper -->
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute inset-0 wallpaper"></div>
    <div class="absolute inset-0 wallpaper-glow"></div>
  </div>

  <!-- Header -->
  <header id="app-header"
          class="bg-gray-900/80 backdrop-blur fixed top-0 left-0 w-full z-[2000] h-16 shadow"
          style="padding-top: env(safe-area-inset-top)">
    <div class="relative h-full flex items-center justify-center">
      <!-- centered logo -->
      <a href="{{ url_for('home.index') }}"
         class="absolute left-1/2 -translate-x-1/2 z-[2050] pointer-events-auto">
        <img id="figurella-logo"
             src="{{ url_for('static', filename='images/figurella-logo.png') }}"
             alt="Figurella Logo"
             class="h-10 select-none"
             draggable="false"
             style="cursor:pointer;">
      </a>

      <!-- right-side Admin dropdown -->
      <div class="absolute right-4 top-0 h-full flex items-center z-[2200] pointer-events-auto">
        <div class="relative flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gray-800 text-white grid place-items-center border border-white/25" title="Admin">
            A
          </div>
          <button id="profile-menu-btn" type="button"
                  class="text-white/90 hover:text-white bg-transparent px-2 py-1 rounded-md font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-figurella/40 pointer-events-auto"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu"
                  onclick="window.__toggleProfileMenu && window.__toggleProfileMenu(event)">
            Admin ▾
          </button>

          <!-- Dropdown: Home + Reports + Log out -->
          <div id="profile-menu" role="menu"
               class="hidden absolute right-0 top-12 min-w-[220px] bg-gray-900 text-gray-200 border border-white/10 rounded-xl shadow-xl overflow-hidden z-[2300]">
            <a href="{{ url_for('home.index') }}"
               class="flex items-center gap-2 px-3 py-2 hover:bg-gray-800" role="menuitem">
              <i class="bi bi-house"></i>
              <span>Home</span>
            </a>
            <a href="/figurella-reports/reports/home"
               class="flex items-center gap-2 px-3 py-2 hover:bg-gray-800" role="menuitem">
              <i class="bi bi-bar-chart"></i>
              <span>Reports</span>
            </a>
            <div class="h-px bg-white/10 my-1"></div>
            <a href="{{ url_for('auth.logout') }}" role="menuitem"
               class="block px-3 py-2 hover:bg-gray-800">Log out</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main id="app-main" class="bg-transparent">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}

  <!-- Editable table popup modal -->
  <div id="table-modal" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-50" role="dialog" aria-modal="true">
    <div class="relative bg-white rounded-lg p-6 max-w-4xl max-h-[80vh] overflow-auto">
      <button id="table-modal-close" class="absolute top-2 right-2 text-gray-600 hover:text-gray-800 text-2xl leading-none" aria-label="Close">&times;</button>
      <div id="table-modal-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script defer src="{{ url_for('static', filename='js/autosave/index.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/autosave/impl.disabled.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/frequency.js') }}"></script>

  <script defer src="{{ url_for('static', filename='js/charts/client_modal.core.js') }}?v=drag4"></script>
  <script defer src="{{ url_for('static', filename='js/charts/client_modal.positioning.js') }}?v=drag4"></script>
  <script defer src="{{ url_for('static', filename='js/charts/client_modal.js') }}?v=drag4"></script>
  <script defer src="{{ url_for('static', filename='js/charts/client_modal.tabs.js') }}?v=2"></script>

  <script defer src="{{ url_for('static', filename='js/charts/client_sidebar_filter.client_modal.content.js') }}?v=drag3"></script>
  <script defer src="{{ url_for('static', filename='js/charts/measures_asof.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/flags.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/move_preview.js') }}"></script>

  <!-- Row click bootstrap -->
  <script>
    document.addEventListener('click', function(e){
      const tr =
        e.target.closest?.('[data-open-chart="1"]') ||
        e.target.closest?.('tr.client-row') ||
        e.target.closest?.('tr[data-name]');
      if (tr && typeof window.openClientChart === 'function') {
        e.preventDefault();
        window.openClientChart(tr);
      }
    });
  </script>

  <!-- iOS-safe viewport height + device detection (.ios class on <html>) -->
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) document.documentElement.classList.add('ios');

      function setVh() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh, { passive:true });
      window.addEventListener('orientationchange', setVh, { passive:true });

      document.documentElement.style.setProperty('-webkit-text-size-adjust', '100%');
    })();
  </script>

  <!-- PWA SW -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>

  <!-- Enable multi-modals globally -->
  <script>
    window.addEventListener('load', function () {
      try {
        if (window.ClientModal && window.ClientModal.enableMulti) {
          window.ClientModal.enableMulti();
        } else {
          window.CHARTS_SINGLETON = false;
        }
      } catch (e) {}
    });
  </script>

  <!-- Inline Admin dropdown toggler (single source of truth) -->
  <script>
    // Called by the button's onclick
    window.__toggleProfileMenu = function (e) {
      try {
        e && (e.preventDefault(), e.stopPropagation());
        var btn  = document.getElementById('profile-menu-btn');
        var menu = document.getElementById('profile-menu');
        if (!btn || !menu) return;
        var isHidden = menu.classList.contains('hidden');
        if (isHidden) {
          menu.classList.remove('hidden');
          btn.setAttribute('aria-expanded','true');
        } else {
          menu.classList.add('hidden');
          btn.setAttribute('aria-expanded','false');
        }
      } catch (_) {}
    };

    // Close on outside click / Esc, ensure layering/clickability
    (function(){
      var btn  = document.getElementById('profile-menu-btn');
      var menu = document.getElementById('profile-menu');
      if (!btn || !menu) return;

      document.addEventListener('click', function(ev){
        if (!menu.classList.contains('hidden')) {
          if (!menu.contains(ev.target) && !btn.contains(ev.target)) {
            menu.classList.add('hidden');
            btn.setAttribute('aria-expanded','false');
          }
        }
      }, {capture:true});

      document.addEventListener('keydown', function(ev){
        if (ev.key === 'Escape' && !menu.classList.contains('hidden')) {
          menu.classList.add('hidden');
          btn.setAttribute('aria-expanded','false');
        }
      });

      // Safety: make sure it can receive clicks and sits on top
      menu.style.zIndex = '2300';
      menu.style.pointerEvents = 'auto';
    })();
  </script>

  <!-- Bottom “open charts” tabs bar container -->
  <div id="modal-tabs-bar" hidden></div>

</body>
</html>
